[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telebirr-python"
version = "0.1.0"
description = "Asynchronous, type-safe Python SDK for Telebirr and mobile money integrations in Ethiopia."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Hailegiorgis Yirgu", email = "hgyirgu1@gmail.com"}
]
dependencies = [
  "httpx>=0.24.0",
  "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0"
]
